<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星辰彩讯 · 规律走势</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app">
  <header class="page-hd"><a class="back" href="index.html">‹</a><b>规律走势</b><span class="s">新澳 / 香港 · 近 4 期</span></header>
  <div class="err" id="err"></div>
  <div class="note">走势图来自主站公开资料（只读引用，jsDelivr 加速）。每期多张图，点开看大图；仅供资料参考。</div>
  <div class="gcards" id="gcards"><div class="loading">走势加载中…</div></div>
  <div class="foot">图源：主站公开资料 · 只读引用</div>
</div>
<nav class="tab">
  <a href="index.html"><span class="i">⌂</span>首页</a>
  <a href="ziliao.html"><span class="i">▤</span>资料</a>
  <a class="on" href="guilv.html"><span class="i">∿</span>走势</a>
  <a href="gallery.html"><span class="i">▦</span>图库</a>
  <a href="index.html#zod"><span class="i">◎</span>生肖</a>
</nav>
<script src="app.js"></script>
<script>
(function () {
  "use strict";
  var S = window.SD;
  function boot() {
    S.get("data/guilv.json").then(function (g) {
      var games = (g && g.games) || [];
      games = games.filter(function (x) { return x.tabId === "macau" || x.tabId === "hk"; });
      var html = games.map(function (gm) {
        var issues = (gm.issues || []).slice().sort(function (a, b) { return (b.issue || 0) - (a.issue || 0); }).slice(0, 4);
        var rows = issues.map(function (it) {
          var imgs = (it.images || []).slice(0, 4).map(function (im) {
            var u = S.imgUrl(im.localPath || im.file || "");
            return '<a href="' + u + '" target="_blank" rel="noopener">' + S.imgTag(im.localPath || im.file || '', '走势图') + '</a>';
          }).join("");
          return '<div class="gissue"><span class="i">' + S.shortIssue(it.issue) + '期</span><span class="imgs">' + imgs + '</span></div>';
        }).join("");
        return '<div class="gcard"><div class="gcard-h">' + (gm.name || gm.tabId) + '<span>近 4 期</span></div><div class="gissues">' + rows + '</div></div>';
      }).join("");
      document.getElementById("gcards").innerHTML = html || '<div class="loading">暂无走势数据</div>';
    }).catch(function (e) { S.showErr(e.message || "走势加载失败"); });
  }
  boot();
})();
</script>
</body>
</html>
